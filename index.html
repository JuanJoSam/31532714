<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" sizes="32x32" href="/icon/cropped-logonuevo-32x32.png">
    <link rel="icon" sizes="192x192" href="/icon/cropped-logonuevo-192x192.png">
    <link rel="stylesheet" href="/css/style.css">
    <title>ATI[UCV]Log 2026-1</title>
    <script type="text/javascript" src="/data/index.json" defer></script>

    <script>
        let urlParams = new URLSearchParams(window.location.search);

        if (!urlParams.has('lang')) {
            window.history.replaceState({}, '', '?lang=ES');
            urlParams = new URLSearchParams(window.location.search);
        }
        const idioma = urlParams.get('lang').toUpperCase();

        const scriptConfig = document.createElement('script');
        scriptConfig.type = 'text/javascript';
        scriptConfig.src = `/conf/config${idioma}.json`;

        scriptConfig.onload = function() {
            const scriptMain = document.createElement('script');
            scriptMain.type = 'text/javascript';
            scriptMain.src = '/js/index.js';
            document.head.appendChild(scriptMain);
        };

        document.head.appendChild(scriptConfig);
    </script>
    
</head>
<body>
    <header>
        <nav>
            <ul>
                <li>
                    <a href="/index.html" class= "menu_principal">
                        <h1 id = "logo">
                            <span id = "logo_izq"></span>
                            <span id = "logo_mid"></span>
                            <span id = "logo_der"></span>
                        </h1>
                    </a>
                </li>
                <li>
                    <form id = "formulario">
                        <input type="text" id="nombre" name="nombre" placeholder="">
                        <button id = "boton_formulario"></button>
                    </form>
                </li>
                <li id = "profile">
                    <span class = "texto_perfil"></span>
                    <img src="/icon/userIcon.svg" alt = "icon" id = "icon_profile">
                </li>
                <li id = "menu">
                    <img src="/icon/menuIcon.svg" alt = "icon">
                </li>
            </ul>
        </nav>
    </header>
    <div class="principal">
        <h1 id = "titulo_principal"></h1>

        <div class ="contenedor">
            <ul id = "listado_perfiles_principal">

            </ul>
            <span id = "msg_auxiliar"></span>
        </div>
    </div>
    <footer>
        <article id="derechos">
        </article>
    </footer>
</body>
</html>
